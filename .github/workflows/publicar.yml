name: Publicar no Instagram

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data do post (AAAA-MM-DD), pasta em publicar/"
        required: true
      feed:
        description: "Publicar no feed"
        type: boolean
        default: true
      reel:
        description: "Publicar o Reel"
        type: boolean
        default: true
      story:
        description: "Publicar o Story"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Publicar
        run: |
          ALVOS=""
          [ "${{ inputs.feed }}" = "true" ] && ALVOS="$ALVOS,feed"
          [ "${{ inputs.reel }}" = "true" ] && ALVOS="$ALVOS,reel"
          [ "${{ inputs.story }}" = "true" ] && ALVOS="$ALVOS,story"
          ALVOS="${ALVOS#,}"
          echo "Publicando ${{ inputs.data }}: $ALVOS"
          python scripts/publicar.py "${{ inputs.data }}" "$ALVOS"

      - name: Registrar publicacao
        if: always()
        run: |
          git config user.name "dicas-de-obra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "Registro da publicacao ${{ inputs.data }}"
          git pull -q --rebase --autostash origin main
          git push
